name: Build Self-host Image

# 只手动触发。这个 fork 不需要每次 push 都消耗 Actions 时间构建镜像。
on:
  workflow_dispatch:
    inputs:
      app-version:
        description: '写入 package.json 的版本号（显示在"关于"页）'
        required: true
        type: string
        default: '0.27.4'
      image-tag:
        description: '镜像主 tag'
        required: true
        type: string
        default: '0.27.4-selfhost'

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # native
  # ---------------------------------------------------------------------------
  # 必须固定 ubuntu-22.04：运行镜像是 node:22-bookworm-slim（glibc 2.36），
  # 而 ubuntu-latest 已是 24.04（glibc 2.39），在那里编出来的 .node 会因为
  # 需要更高版本的 glibc 而无法在镜像内加载。
  native:
    name: Build server-native (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native

      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: 'x86_64-unknown-linux-gnu'
          package: '@affine/server-native'

      # docker-clean.mjs 只保留 server-native.<arch>.node，未重命名的
      # server-native.node 会被当成多余产物删掉，运行时就加载不到了。
      - name: Rename to arch-specific name
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node

      - name: Upload server-native
        uses: actions/upload-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native/server-native.x64.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # frontend
  # ---------------------------------------------------------------------------
  # web / admin / mobile 三份产物 Dockerfile 都会 COPY，缺一个 docker build
  # 就会失败——即使这台实例根本不用移动端。
  frontend:
    name: Build web / admin / mobile
    runs-on: ubuntu-latest
    # 生产镜像走 stable 渠道，否则前端带 canary 图标和 changelog 地址。
    # 只作用于前端产物，server bundle 不需要（官方也只在前端 job 设）。
    env:
      BUILD_TYPE: stable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build @affine/web
        run: yarn affine @affine/web build

      - name: Build @affine/admin
        run: yarn affine @affine/admin build

      - name: Build @affine/mobile
        run: yarn affine @affine/mobile build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            ./packages/frontend/apps/web/dist
            ./packages/frontend/admin/dist
            ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # server
  # ---------------------------------------------------------------------------
  # 步骤顺序刻意与上游 build-images.yml 的 build-server job 保持一致
  # （先 setup-node 再下载 native），这条路径是上游验证过的。
  server:
    name: Build server bundle
    runs-on: ubuntu-latest
    needs:
      - native
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native

      - name: List server-native files
        run: ls -alh ./packages/backend/native

      # 不用 `yarn workspace @affine/server build`：它经由
      # tools/cli/bin/cli.js 再 spawn 一层，那层历史上会丢弃子进程退出码。
      # 这里直接走根脚本 affine -> r affine.ts，少一层转发。
      - name: Build Server
        run: yarn affine bundle -p @affine/server

      # bundle 空转时退出码仍是 0，不校验就会推出一个缺 dist/main.js 的
      # 镜像，直到容器起不来才发现。
      - name: Verify server bundle
        run: |
          echo '--- packages/backend/server/dist ---'
          ls -la packages/backend/server/dist || true
          if [ ! -f packages/backend/server/dist/main.js ]; then
            echo '::error::dist/main.js 缺失，server bundle 没有产出'
            exit 1
          fi
          size=$(stat -c%s packages/backend/server/dist/main.js)
          echo "main.js size: ${size} bytes"
          # 正常产物是 MB 级；只有几 KB 说明 src 被当成 external 了
          if [ "$size" -lt 102400 ]; then
            echo '::error::dist/main.js 过小，产物无效'
            exit 1
          fi

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # image
  # ---------------------------------------------------------------------------
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs:
      - native
      - frontend
      - server
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./packages/frontend

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env

      # 换成生产依赖。只构建 amd64，不需要 arm 的可选依赖。
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      # Dockerfile 只是 COPY，产物缺失不会让 build 失败，只会做出一个
      # 起不来的镜像。在推送前把三份产物都确认一遍。
      - name: Verify docker build context
        run: |
          fail=0
          for f in \
            packages/backend/server/dist/main.js \
            packages/backend/server/node_modules \
            packages/backend/server/node_modules/@prisma/client \
            packages/frontend/apps/web/dist/index.html \
            packages/frontend/admin/dist/index.html \
            packages/frontend/apps/mobile/dist/index.html
          do
            if [ -e "$f" ]; then
              echo "ok   $f"
            else
              echo "MISS $f"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo '::error::docker build context 不完整'; exit 1; }

      # GHCR 的 namespace 必须是小写，owner 名大小写不确定，统一转一次
      - name: Resolve image name
        id: image
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/affine" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          provenance: false
          file: .github/deployment/node/Dockerfile.selfhost
          tags: |
            ${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}
            ${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}-${{ steps.image.outputs.sha }}

      - name: Summary
        run: |
          {
            echo '### 镜像已推送'
            echo ''
            echo '```'
            echo '${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}'
            echo '${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}-${{ steps.image.outputs.sha }}'
            echo '```'
            echo ''
            echo '首次推送后 GHCR package 默认是 Private，服务器拉取前需要先 docker login。'
          } >> "$GITHUB_STEP_SUMMARY"
