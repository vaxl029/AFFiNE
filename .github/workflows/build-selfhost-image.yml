name: Build Self-host Image

# 只手动触发。这个 fork 不需要每次 push 都消耗 Actions 时间构建镜像。
on:
  workflow_dispatch:
    inputs:
      app-version:
        description: '写入 package.json 的版本号（显示在"关于"页）'
        required: true
        type: string
        default: '0.27.4'
      image-tag:
        description: '镜像主 tag'
        required: true
        type: string
        default: '0.27.4-selfhost'

permissions:
  contents: read
  packages: write

env:
  # 生产镜像走 stable 渠道，否则前端会带 canary 图标与 changelog 地址
  BUILD_TYPE: stable

jobs:
  # ---------------------------------------------------------------------------
  # native
  # ---------------------------------------------------------------------------
  # 必须固定 ubuntu-22.04：运行镜像是 node:22-bookworm-slim（glibc 2.36），
  # 而 ubuntu-latest 已是 24.04（glibc 2.39），在那里编出来的 .node 会因为
  # 需要更高版本的 glibc 而无法在镜像内加载。
  native:
    name: Build server-native (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native

      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: 'x86_64-unknown-linux-gnu'
          package: '@affine/server-native'

      # docker-clean.mjs 只保留 server-native.<arch>.node，未重命名的
      # server-native.node 会被当成多余产物删掉，运行时就加载不到了。
      - name: Rename to arch-specific name
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node

      - name: Upload server-native
        uses: actions/upload-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native/server-native.x64.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # frontend
  # ---------------------------------------------------------------------------
  # web / admin / mobile 三份产物 Dockerfile 都会 COPY，缺一个 docker build
  # 就会失败——即使这台实例根本不用移动端。
  frontend:
    name: Build web / admin / mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build @affine/web
        run: yarn affine @affine/web build

      - name: Build @affine/admin
        run: yarn affine @affine/admin build

      - name: Build @affine/mobile
        run: yarn affine @affine/mobile build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            ./packages/frontend/apps/web/dist
            ./packages/frontend/admin/dist
            ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # image
  # ---------------------------------------------------------------------------
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs:
      - native
      - frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./packages/frontend

      # server bundle 需要 native 产物在位，所以放在下载之后
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env

      - name: Build Server
        run: yarn workspace @affine/server build

      # 换成生产依赖。只构建 amd64，不需要 arm 的可选依赖。
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      # GHCR 的 namespace 必须是小写，owner 名大小写不确定，统一转一次
      - name: Resolve image name
        id: image
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/affine" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          provenance: false
          file: .github/deployment/node/Dockerfile.selfhost
          tags: |
            ${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}
            ${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}-${{ steps.image.outputs.sha }}

      - name: Summary
        run: |
          {
            echo '### 镜像已推送'
            echo ''
            echo '```'
            echo '${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}'
            echo '${{ steps.image.outputs.repo }}:${{ inputs.image-tag }}-${{ steps.image.outputs.sha }}'
            echo '```'
            echo ''
            echo '首次推送后 GHCR package 默认是 Private，服务器拉取前需要先 docker login。'
          } >> "$GITHUB_STEP_SUMMARY"
